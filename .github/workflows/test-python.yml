name: Test Python Code

on:
  push:
    paths:
      - 'model/**'
      - 'validation/**'
      - 'figures/**'
      - '*.py'
  pull_request:
    paths:
      - 'model/**'
      - 'validation/**'
      - 'figures/**'
      - '*.py'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run smoke tests
        run: |
          python -c "
          from model import BiosphereCodec
          import torch

          # Test model instantiation
          model = BiosphereCodec(vocab=100, d_model=64, n_layers=1, latent_dim=16)
          x = torch.randint(0, 99, (2, 32))
          loss, logs = model(x)
          assert loss.item() > 0, 'Loss should be positive'
          print('✅ Model smoke test passed')
          "

      - name: Validate constants.yaml
        run: |
          python -c "
          import yaml

          with open('constants.yaml') as f:
              C = yaml.safe_load(f)

          # Check required keys exist
          assert 'curvature' in C
          assert 'entropy' in C
          assert 'geometry' in C

          # Check values are in expected ranges
          kappa = C['curvature']['kappa_empirical']
          assert 1.0 < kappa < 2.0, f'κ={kappa} out of range'

          h = C['entropy']['h_effective_bits']
          assert 1.0 < h < 2.0, f'h={h} out of range'

          print('✅ Constants validation passed')
          "

      - name: Check code style
        run: |
          pip install flake8
          flake8 model/ --max-line-length=120 --ignore=E501,W503 || true
