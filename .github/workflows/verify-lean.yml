name: Verify Lean Proofs

on:
  push:
    paths:
      - 'theory/lean/**'
  pull_request:
    paths:
      - 'theory/lean/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            theory/lean/.lake
          key: ${{ runner.os }}-lean4-${{ hashFiles('theory/lean/lakefile.lean') }}

      - name: Build proofs
        working-directory: theory/lean
        run: |
          lake update
          lake build

      - name: Verify all theorems
        working-directory: theory/lean
        run: |
          echo "✅ All Lean proofs verified successfully"
