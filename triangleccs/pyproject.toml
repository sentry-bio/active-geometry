[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triangleccs"
version = "1.1.0"
description = "Geodetic decoder datum for a tree-structured source on an overwriting tape"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Rohit Fenn", email = "rohit@sentry.bio" },
    { name = "Amit Fenn" },
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sentry-bio/triangleccs"
Related = "https://github.com/sentry-bio/active-geometry"

[tool.setuptools.packages.find]
include = ["triangleccs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
