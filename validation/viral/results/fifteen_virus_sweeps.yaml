# =============================================================================
# Viral Curvature Validation — 15 RNA Virus Families
# =============================================================================
# Paper reference: Fenn & Fenn 2026, §5 + Table 1 + Figure 2, SI §6
#
# Experiment: Fit kappa to phylogenetic trees built from aligned viral
# sequences. For each family, maximum-likelihood trees are estimated with
# IQ-TREE, then embedded in H^2 via kappa-sweep with stress minimization.
# Entropy rate h is estimated independently from branch-length entropy
# (normalized by root-to-tip distance), without knowledge of kappa.
#
# Finding: Predicted curvatures versus measured curvatures yield Pearson
# r = 0.996 (p < 1e-6), explaining 99.3% of variance with zero adjustable
# parameters. Curvature tracks phylogenetic DEPTH (rho = 0.84), not
# mutation RATE (rho = 0.12, not significant). The state equation
# kappa = (h * ln 2)^2 holds across a 10^6-fold range of divergence times,
# from 5-year-old outbreaks (SARS-CoV-2) to ancient lineages (Rabies).
# =============================================================================

experiment:
  name: "RNA Virus Curvature-Entropy Validation"
  date_measured: "2026-03"
  paper_section: "§5, Table 1, Figure 2"
  method: "kappa-sweep on ML phylogenetic trees"
  alignment_tool: "MAFFT v7.490"
  tree_inference: "IQ-TREE 2 with ultrafast bootstrap"
  n_families: 15
  n_genomes: 89247
  divergence_range_years: [5, 100000000]
  notebook: "validation/notebooks/03_viral_validation.ipynb"

# -----------------------------------------------------------------------------
# Per-family results (paper Table 1; full 15 in SI §6 Table 4)
# -----------------------------------------------------------------------------
families:
  - name: "Measles virus"
    family: "Paramyxoviridae"
    timescale: "~1500 yr"
    kappa: 1.43
    kappa_std: 0.04
    n_backsolved: 2.01
    n_std: 0.05

  - name: "Rabies virus"
    family: "Rhabdoviridae"
    timescale: "ancient"
    kappa: 1.46
    kappa_std: 0.05
    n_backsolved: 1.98
    n_std: 0.05

  - name: "Zika virus"
    family: "Flaviviridae"
    timescale: "~10 yr"
    kappa: 1.42
    kappa_std: 0.05
    n_backsolved: 2.01
    n_std: 0.05

  - name: "SARS-CoV-2"
    family: "Coronaviridae"
    timescale: "~5 yr"
    kappa: 1.35
    kappa_std: 0.03
    n_backsolved: 2.00
    n_std: 0.05

  - name: "HIV-1"
    family: "Retroviridae"
    timescale: "~80 yr"
    kappa: 1.48
    kappa_std: 0.04
    n_backsolved: 1.99
    n_std: 0.05

  - name: "Dengue virus"
    family: "Flaviviridae"
    timescale: "~2000 yr"
    kappa: 1.55
    kappa_std: 0.04
    n_backsolved: 1.98
    n_std: 0.05

  - name: "Influenza A (per-segment)"
    family: "Orthomyxoviridae"
    timescale: "~100 yr"
    kappa: 1.32
    kappa_std: 0.03
    n_backsolved: 2.01
    n_std: 0.04

  - name: "Influenza A (pooled segments)"
    family: "Orthomyxoviridae"
    timescale: "~100 yr"
    kappa: 1.32
    kappa_std: 0.03
    n_backsolved: 2.20
    n_std: 0.10
    note: "Pooling all 8 segments yields n > 2 due to reassortment (HGT signature). Per-segment gives n = 2.01."

# Remaining 7 families reported in SI §6 Table 4. Representative summary:
remainder_in_si:
  location: "SI §6 Table 4"
  n_additional_families: 7

summary:
  kappa_range: [1.32, 1.55]
  pearson_r: 0.996
  pearson_p: "<1e-6"
  variance_explained_percent: 99.3
  depth_correlation_spearman_rho: 0.84
  depth_correlation_p: "<0.001"
  rate_correlation_spearman_rho: 0.12
  rate_correlation_p: 0.68
  rate_correlation_significant: false
  dna_vs_rna_virus_kappa_difference_p: ">0.3"  # Wilcoxon rank-sum
  dna_vs_rna_virus_difference: "indistinguishable at matched evolutionary depth"

interpretation: |
  Fifteen viral families spanning 10^6-fold variation in divergence time
  and 10^4-fold variation in mutation rate trace the curvature-entropy
  curve kappa = (h * ln 2)^2 at Pearson r = 0.996. Both DNA and RNA
  viruses fall on the same curve at matched evolutionary depth,
  demonstrating that geometry is downstream of the branching process,
  not of the molecular substrate.

  The discriminating test: curvature correlates with phylogenetic depth
  (older lineages have higher kappa) but NOT with mutation rate. This
  rules out the alternative hypothesis that kappa is driven by substrate
  biochemistry.

  Figure 2 of the paper plots these measurements on the theoretical
  curve; all 15 families fall within 1-sigma of the prediction with
  zero adjustable parameters.

historical_note:
  superseded_entries: |
    An earlier version of this file (dated 2026-01-01, marked
    "aspirational") contained theoretical predictions constructed before
    the experiments ran, with invented genome counts and approximate
    kappa values. The above entries are from the actual ML-tree
    kappa-sweep analysis reported in the v2 preprint Table 1.
