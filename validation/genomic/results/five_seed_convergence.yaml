# =============================================================================
# Five-Seed Procrustes Convergence — BiosphereCodec Reference Encoder
# =============================================================================
# Paper reference: Fenn & Fenn 2026, §4.1 + §7.5 "Architecture independence"
#                  SI §3 Table 3
#
# Experiment: Train the reference BiosphereCodec on 5,550 genomes with five
# independent random seeds. Curvature is FIXED at kappa = 1.0 (not learned);
# the paper does not claim kappa emerges from training. What is measured here
# is coordinate convergence across independent runs — whether the hyperbolic
# geometry is intrinsic to the data or an artifact of initialization.
#
# Result: All 10 pairwise Procrustes correlations lie in [0.92, 0.98], with
# mean r = 0.94 +/- 0.02. The sole undetermined degree of freedom is a global
# SO(2) rotation — the expected continuous symmetry of an isotropic 2D
# embedding. This confirms the coordinate system is a property of the data.
# =============================================================================

experiment:
  name: "Five-Seed Procrustes Coordinate Convergence"
  date_measured: "2026-03-11"
  paper_section: "§4.1 + §7.5, SI §3"
  hypothesis: >
    If hyperbolic geometry is intrinsic to the data, independent training
    runs with different random initializations should converge to the same
    coordinate system (up to global rotation).
  dataset: "5,550 RefSeq genomes (Bacteria 65%, Archaea 20%, Eukaryota 15%)"
  model: "BiosphereCodec reference (4-layer Hyena, Poincare ball, latent_dim=129)"
  training:
    curvature: 1.0    # FIXED — not a learnable parameter in this protocol
    steps: 7000
    time_hours_per_seed: 48
    gpu: "NVIDIA RTX 4070 Ti"
    seeds: [0, 42, 137, 2024, 888]
  analysis_script: "experiments/coordinate_convergence/run_procrustes_analysis.py"
  raw_output: "experiments/coordinate_convergence/procrustes_results_real.json"
  notebook: "validation/notebooks/01_neural_convergence.ipynb"

kappa_per_seed:
  seed_0:     1.0
  seed_42:    1.0
  seed_137:   1.0
  seed_2024:  1.0
  seed_888:   1.0

pairwise_procrustes_correlations:
  # All C(5,2) = 10 seed pairs
  seed_0_vs_42:      0.9373
  seed_0_vs_137:     0.9379
  seed_0_vs_2024:    0.9642
  seed_0_vs_888:     0.9769
  seed_42_vs_137:    0.9338
  seed_42_vs_2024:   0.9214
  seed_42_vs_888:    0.9440
  seed_137_vs_2024:  0.9579
  seed_137_vs_888:   0.9433
  seed_2024_vs_888:  0.9648

summary:
  n_pairs: 10
  mean_procrustes_r: 0.9482
  std_procrustes_r:  0.0163
  min_procrustes_r:  0.9214
  max_procrustes_r:  0.9769
  paper_reported:    "0.94 ± 0.02"   # Paper rounds to 2 sig figs
  all_above_0.90:    true
  n_sequences_per_seed: 200

interpretation: |
  The coordinate geometry is substantially reproducible across random seeds
  at fixed curvature (kappa = 1.0). The mean pairwise Procrustes correlation
  r = 0.948 (paper rounds to 0.94 ± 0.02) indicates that, after optimal
  rotation, the same organisms occupy the same positions across independently
  trained models.

  This result demonstrates that the hyperbolic coordinate system is a
  property of the data, not the architecture or the training random state.
  The paper's §7.5 "Architecture independence" section generalizes this:
  a 40K-parameter minimal encoder (single conv layer, 3-layer MLP, no
  classification heads, no ODE flow) with kappa fixed at 1.25 reaches
  Procrustes residual 0.020 across 268 organisms — confirming that the
  coordinate system is determined by the data, not by architectural choices.

  WHAT THIS DOES NOT CLAIM: this experiment does not claim that kappa
  emerges from training. Kappa was fixed throughout. The paper's curvature
  value kappa ~ 1.25 is predicted by the state equation (kappa = (h ln 2)^2
  at h = 1.61) and confirmed independently by post-hoc telescope sweeps
  yielding kappa in [1.28, 1.34].

historical_note:
  superseded_entries: |
    Earlier versions of this file (dated 2025-01-01) reported five seeds
    converging to kappa = 1.247 +/- 0.003 with CV = 0.24%. Those values
    traced to an in-place softplus_inverse(1.5) = 1.247518 reparameterization
    in the geoopt manifold constructor, not to a measurement. The seeds in
    the fabricated record (0, 42, 123, 456, 789) did not match the actual
    training seeds (0, 42, 137, 2024, 888). The 2026 v2 preprint correctly
    reports the experiment with kappa fixed at 1.0 and Procrustes r = 0.94
    as the measured quantity.
