# =============================================================================
# Active Geometry: Paper Manifest
# =============================================================================
# Machine-readable specification of claims, measurements, and verification
# for Fenn & Fenn 2026, "Evolution as Active Geometry" (bioRxiv Paper I,
# doi:10.64898/2026.03.09.710612).
# =============================================================================

paper:
  title: "Evolution as Active Geometry"
  subtitle: "The Geometric State Equation of the Tree of Life"
  version: "2.0"
  doi: "10.64898/2026.03.09.710612"
  bibref: "Fenn & Fenn 2026, bioRxiv"

  authors:
    - {name: "Rohit Fenn", affiliation: "Sentry Bio"}
    - {name: "Amit Fenn", affiliation: "Sentry Bio"}

  thesis:
    statement: |
      Any process that retains distinguishable histories at exponential rate
      beta and represents them faithfully at finite radial rate c must use a
      host whose packing entropy obeys beta <= c * h_pack. For Riemannian hosts
      with uniform fixed-ball volume bounds, h_pack = h_vol. Polynomial-growth
      hosts are therefore excluded. Under capacity saturation and an isotropic
      hyperbolic realization, normalized curvature kappa_bar = c^2 * kappa
      obeys kappa_bar = (h * ln 2 / (n-1))^2.

    universal_invariant: |
      Genuinely branching tree metrics have minimal smooth hyperbolic ambient
      dimension n = 2 in the embedding class used here. Back-solving n from
      independently measured, consistently calibrated (h,c,kappa) is a test of
      capacity saturation, not an independent derivation of dimension.
      Reported biological systems yield n near 2; curvature magnitude remains
      dependent on rate, radial calibration, and scale.

  abstract:
    universal_invariant: "reported n = 2.00 +/- 0.05; theoretical status is a pure-tree embeddability prediction"
    state_equation: "kappa = (h * ln 2 / (n-1))^2, zero free parameters"
    inter_domain_kappa: "kappa in [1.28, 1.34] (telescope on 3-domain encoder)"
    intra_domain_kappa: "kappa = 3.0 (fungi), 12.7 (archaea), 16.4 (bacteria)"
    cross_alphabet_prediction: "3.1x jump DNA -> protein at Pearson r = 0.996 (15 viral families)"
    encoder_convergence: "Procrustes r = 0.94 +/- 0.02 across 5 seeds at fixed kappa = 1.0"

# =============================================================================
# Formal Verification (Machine-Checked)
# =============================================================================
formal_verification:
  theoretical_kernel: "theory/ADDRESSABILITY_KERNEL.md"
  mathematical_spine: "theory/MATHEMATICAL_SPINE.md"
  lean_files:
    - "theory/lean/ActiveGeometry/Packing.lean"
    - "theory/lean/ActiveGeometry/Capacity.lean"
    - "theory/lean/ActiveGeometry/StateEquation.lean"
    - "theory/lean/ActiveGeometry/Measurability.lean"
  status: "MACHINE-CHECKED"
  sorries: 0
  axioms_used: ["propext", "Classical.choice", "Quot.sound"]

  scope_note: |
    Lean proves the finite-depth metric packing count and the convergent-rate
    addressability theorem (addressability_limit) using Mathlib's exact
    Metric.packingNumber. It keeps the next logical levels explicit:
    CapacitySaturated is a separate hypothesis, and hcap_eq_spaceForm is a
    rate identification with (n-1)√κ, not a theorem that the host is H^n.
    It checks their algebraic consequences, including the curvature floor,
    normalized scale invariance, and the equality-case face. It does not
    formalize the limsup extension, Theorem 4.4 (Skenderi), Theorem 7.1
    (Heintze/A3), capacity saturation as a physical law, a dynamics toward
    equality, or DNA/alphabet entropy ceilings.

  core_theorems:
    - {name: "addressability_limit", statement: "in a proper metric host, diverging radii and independent represented-growth, radial-rate, and exact packing-rate limits imply beta <= c*h_pack"}
    - {name: "addressability_limit_of_hasFinitePacking", statement: "the same implication with packing finiteness as an explicit hypothesis"}
    - {name: "hasFinitePacking_of_properSpace", statement: "in a proper metric space the packing-finiteness hypothesis is a theorem, not an assumption"}
    - {name: "addressability_forces_positive_entropy", statement: "beta > 0, c > 0, and beta <= c*h_cap imply h_cap > 0"}
    - {name: "efficiency_le_one", statement: "for c,h_cap > 0 and beta <= c*h_cap, eta = beta/(c*h_cap) <= 1"}
    - {name: "curvature_at_least_floor", statement: "for beta,c > 0, n > 1, kappa >= 0, space-form addressability implies kappa >= (beta/(c(n-1)))^2"}
    - {name: "addressable_spaceForm_floor", statement: "Addressable plus hcap_eq_spaceForm implies the curvature floor"}
    - {name: "saturated_curvature_eq_floor", statement: "for c > 0, n > 1, and kappa >= 0, capacity saturation fixes raw curvature magnitude once c and n are fixed"}
    - {name: "normalized_state_equation", statement: "CapacitySaturated plus hcap_eq_spaceForm implies the normalized state equation"}
    - {name: "normalized_floor_eq_saturation", statement: "c^2*kappa_floor = (h*ln2/(n-1))^2, the saturation-face value"}
    - {name: "normalized_curvature_scale_invariant", statement: "c^2*kappa is invariant under radial rescaling"}
    - {name: "normalizedCurvatureAtSaturation_two", statement: "the saturation-face normalized curvature at n=2 is (h * log 2)^2"}
    - {name: "normalizedCurvatureAtSaturation_anti_n", statement: "n1 < n2 => the saturation-face value decreases; algebraic, not a selection of n=2"}

  mismatch_diagnostics:
    - {name: "rateMismatchSq_eq_scaled_sqrtMismatch", statement: "rateMismatchSq = (c*(n-1))^2 * sqrtCurvatureMismatch; the two scale-aware gap diagnostics are one object"}
    - {name: "sqrtCurvatureMismatch_zero_iff", statement: "On non-negative curvature magnitudes, the square-root mismatch vanishes iff the curvatures are equal; no dynamics is claimed"}
    - {name: "rateMismatchSq_zero_iff", statement: "rateMismatchSq = 0 iff kappa equals the equality-case value; a corollary of the scaling identity"}
    - {name: "rateMismatch_zero_at_floor", statement: "space-form capacity at the curvature floor equals demand"}

# =============================================================================
# Results with Verification Protocols
# =============================================================================
results:
  R1:
    title: "Neural encoder coordinate convergence across five seeds"
    section: "§4.1"
    category: "empirical"

    key_finding:
      quantity: "Procrustes r (not kappa)"
      r_mean: 0.94
      r_std: 0.02
      n_seeds: 5
      training_kappa: 1.0  # fixed, not learned
      n_genomes: 5550
      method: "hyperbolic_Procrustes_alignment"

    note: |
      Kappa is FIXED at 1.0 during training; the paper explicitly does NOT
      claim kappa emerges from gradient descent (§7.5: "curvature is
      degenerate with InfoNCE temperature in contrastive learning"). What is
      measured is coordinate stability across random initializations. The
      sole undetermined degree of freedom is a global SO(2) rotation.

    verification:
      notebook: "validation/notebooks/01_neural_convergence.ipynb"
      results_file: "validation/genomic/results/five_seed_convergence.yaml"

    figures: ["figure1a"]

  R2:
    title: "Curvature predicted from entropy rate at inter-domain scale"
    section: "§3 + §3.4"
    category: "theory + measurement"

    key_finding:
      state_equation: "normalized kappa_bar = c^2*kappa = (h * ln 2)^2 at n = 2"
      predicted_range: [1.20, 1.31]   # h in [1.58, 1.65]
      predicted_central: 1.25          # h = 1.61
      telescope_range: [1.28, 1.34]    # measured on frozen encoder embeddings
      agreement: "within predicted interval"

    verification:
      notebook: "validation/notebooks/02_theory_verification.ipynb"

  R3:
    title: "Viral curvature-entropy law across 15 families"
    section: "§5 + Table 1"
    category: "validation"

    key_finding:
      pearson_r: 0.996
      pearson_p: "<1e-6"
      variance_explained_percent: 99.3
      depth_correlation_rho: 0.84
      rate_correlation_rho: 0.12
      rate_correlation_significant: false
      interpretation: "Curvature tracks phylogenetic depth, not mutation rate"

    datasets: 15
    total_genomes: 89247

    verification:
      notebook: "validation/notebooks/03_viral_validation.ipynb"
      results_file: "validation/viral/results/fifteen_virus_sweeps.yaml"

  R4:
    title: "Cross-alphabet prediction: DNA -> protein curvature jump"
    section: "§6 + Table 5"
    category: "falsifiable prediction"

    key_finding:
      predicted: 3.90        # from h_protein = 2.85 bits (LG model)
      measured_mean: 3.80
      measured_std: 0.60
      families: 15           # Pfam
      agreement_percent: 2.6
      jump_factor: 3.1       # vs kappa_DNA ~ 1.25

    exception:
      family: "RecA/Rad51"
      kappa: 0.89
      n_backsolved: 3.02
      interpretation: |
        Most horizontally-transferred bacterial gene; non-tree topology
        is a biological hypothesis to test with quartet/topology measurements;
        n > 2 back-solved from saturation is not an independent diagnosis.

    verification:
      notebook: "validation/notebooks/02_theory_verification.ipynb"

  R5:
    title: "Falsification tests"
    section: "§5.3"
    category: "negative controls"

    tests:
      - name: "Euclidean_null"
        description: "Random polynomial-growth trees; estimator must return kappa = 0"
        kappa_measured: 0.0000
        kappa_std: 0.0000
        replicates: 5
        result: "PASS"

      - name: "Synthetic_recovery"
        description: "Binary trees with kappa_true = (ln b)^2 for b in {2,3,4,5}"
        mean_relative_error_percent: 1.08
        result: "PASS"

      - name: "Destroyed_structure"
        description: "Shuffled phylogenetic edges; coordinate convergence collapses"
        kappa_measured: 0.0013
        kappa_std: 0.0009
        procrustes_r: "<0.3"
        result: "PASS"

    verification:
      notebook: "validation/notebooks/04_null_simulations.ipynb"

  R6:
    title: "Universal dimensionality n = 2"
    section: "§2 + Figure 1B"
    category: "universality"

    key_finding:
      n_universal: 2.00
      n_std: 0.05
      method: "back-solve n from (kappa, h) via Eq. 1"

    tested_systems:
      cellular_life: 2.01
      viral_families_mean: 2.00
      fungal_tree: 2.00
      archaeal_tree: 1.99
      bacterial_tree: 1.99
      protein_families_mean: 2.03

    interpretation:
      coordinates: ["radial (temporal depth)", "angular (phenotypic direction)"]
      topological_origin: |
        Genuinely branching finite tree metrics admit arbitrarily
        low-distortion embeddings in H^2, while a connected one-dimensional
        Riemannian host cannot embed their branching isometrically (Sarkar
        2012). Path trees remain one-dimensional. The four-point condition
        classifies tree metrics but does not calibrate curvature or dimension.

    verification:
      notebook: "validation/notebooks/05_topology.ipynb"

  R7:
    title: "Curvature is a design parameter, not discovered by training"
    section: "§7.5"
    category: "mechanism"

    key_findings:
      fixed_sweep:
        curvatures: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
        losses:     [2.349, 2.310, 2.305, 2.300, 2.310, 2.320]
        optimal_kappa: 0.75
        loss_variation: "4.3%"
        interpretation: "Loss landscape essentially flat for pure compression"

      learnable:
        converged_kappa: 0.999
        drift_from_init: "<0.1%"
        interpretation: "No gradient signal from compression alone drives kappa to the biologically meaningful range"

    conclusions:
      - "Kappa has no gradient path through pure sequence compression"
      - "Normalized curvature is bounded by addressability and reaches the state-equation value only under capacity saturation"
      - "Coordinate system (not curvature) is a property of the data"

    verification:
      notebook: "validation/notebooks/06_ablation.ipynb"

# =============================================================================
# Container Verification
# =============================================================================
container:
  dockerfile: "Dockerfile"
  entrypoint: "run_all_verifications.sh"

  verification_order:
    - {id: "lean", command: "cd theory/lean && lake build"}
    - {id: "R1", notebook: "validation/notebooks/01_neural_convergence.ipynb"}
    - {id: "R2", notebook: "validation/notebooks/02_theory_verification.ipynb"}
    - {id: "R3", notebook: "validation/notebooks/03_viral_validation.ipynb"}
    - {id: "R5", notebook: "validation/notebooks/04_null_simulations.ipynb"}
    - {id: "R6", notebook: "validation/notebooks/05_topology.ipynb"}
    - {id: "R7", notebook: "validation/notebooks/06_ablation.ipynb"}

  artifacts:
    required:
      - "validation/genomic/results/five_seed_convergence.yaml"
      - "validation/viral/results/fifteen_virus_sweeps.yaml"
      - "validation/phylogenetic/results/tree_kappa_estimates.yaml"

# =============================================================================
# Data Availability
# =============================================================================
data:
  genomes: "NCBI RefSeq (accessions in data/manifests/)"
  viral_sequences: "GenBank (MAFFT v7.490 alignments)"
  phylogenetic_trees:
    - "GTDB r220 bac120 + ar53 species trees (§4.2)"
    - "Li et al. 2021 fungal 290-gene IQ-TREE (§4.2)"
    - "Pfam ML trees via IQ-TREE 2 under LG+G4+F (§6)"
  code: "github.com/sentry-bio/active-geometry (MIT)"

# =============================================================================
# Computational Requirements
# =============================================================================
requirements:
  training: "1x NVIDIA RTX 4070 Ti, ~48 hours per seed (§9.2)"
  verification: "CPU only, ~10 minutes (tree embeddings + κ-sweep)"
  software: ["Python 3.10+", "PyTorch 2.0+", "Lean 4 + Mathlib4"]
